---
- name: Configurar los servidores
  hosts: servidores
  become: true
  tasks:
    - name: Actualizar cache de APT
      ansible.builtin.apt:
        update_cache: true

    - name: Crear el usuario itla
      ansible.builtin.user:
        name: itla
        shell: /bin/bash
        create_home: true

    - name: Crear la carpeta app
      ansible.builtin.file:
        path: /home/itla/app
        state: directory
        owner: itla
        group: itla
        mode: "0755"

    - name: Crear el archivo hola.txt
      ansible.builtin.copy:
        content: "Hola desde Ansible\n"
        dest: /home/itla/app/hola.txt
        owner: itla
        group: itla
        mode: "0644"

    - name: Instalar cowsay y htop
      ansible.builtin.apt:
        name:
          - cowsay
          - htop
        state: present
